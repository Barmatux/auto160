# Canonical host: https://auto160.ru
# All other hosts/HTTP redirect here.

# Primary HTTPS site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auto160.ru;

    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/auto160.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auto160.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP auto160.ru / www → HTTPS canonical
server {
    listen 80;
    listen [::]:80;
    server_name auto160.ru www.auto160.ru;
    return 301 https://auto160.ru$request_uri;
}

# auto160.by (HTTP) → canonical .ru
server {
    listen 80;
    listen [::]:80;
    server_name auto160.by www.auto160.by;
    return 301 https://auto160.ru$request_uri;
}

# auto160.by (HTTPS) → canonical .ru
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auto160.by www.auto160.by;

    ssl_certificate /etc/letsencrypt/live/auto160.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auto160.by/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://auto160.ru$request_uri;
}
