# Canonical host: https://auto160.by
# All other hosts/HTTP redirect here.

# Primary HTTPS site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auto160.by;

    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/auto160.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auto160.by/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP auto160.by / www → HTTPS canonical
server {
    listen 80;
    listen [::]:80;
    server_name auto160.by www.auto160.by;
    return 301 https://auto160.by$request_uri;
}

# auto160.ru (HTTP) → canonical .by
server {
    listen 80;
    listen [::]:80;
    server_name auto160.ru www.auto160.ru;
    return 301 https://auto160.by$request_uri;
}

# auto160.ru (HTTPS) → canonical .by
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auto160.ru www.auto160.ru;

    ssl_certificate /etc/letsencrypt/live/auto160.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auto160.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://auto160.by$request_uri;
}
