<aside class="catalog-filters-panel catalog-sidebar">
  <h3>Фильтры</h3>
  <form class="filters filters-sidebar" method="get" action="{{ catalog_filters_action | default('/catalog') }}" id="catalog-filters-form">
    {% if preserve_makes %}
      {% for make_name in preserve_makes %}
        <input type="hidden" name="make" value="{{ make_name }}" />
      {% endfor %}
    {% endif %}
    {% if preserve_model is defined and preserve_model %}
      <input type="hidden" name="model" value="{{ preserve_model }}" />
    {% endif %}
    {% set checked_transmissions = catalog_sidebar.filters.transmission_checked %}
    <div class="catalog-filter-group">
      <p class="catalog-filter-group-title">Характеристики</p>
      <label class="catalog-filter-field{% if catalog_sidebar.filters.body_type %} is-active{% endif %}">
        Тип кузова
        <select name="body_type">
          <option value="" {% if catalog_sidebar.filters.body_type == "" %}selected{% endif %}>Любой</option>
          {% for value in catalog_sidebar.options.body_type %}
            <option value="{{ value }}" {% if catalog_sidebar.filters.body_type == value %}selected{% endif %}>{{ value }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="catalog-filter-field{% if catalog_sidebar.filters.fuel_type %} is-active{% endif %}">
        Топливо
        <select name="fuel_type">
          <option value="" {% if catalog_sidebar.filters.fuel_type == "" %}selected{% endif %}>Любое</option>
          {% for value in catalog_sidebar.options.fuel_type %}
            <option value="{{ value }}" {% if catalog_sidebar.filters.fuel_type == value %}selected{% endif %}>{{ value }}</option>
          {% endfor %}
        </select>
      </label>
      <label
        class="catalog-filter-field catalog-transmission-dropdown{% if catalog_sidebar.filters.transmission %} is-active{% endif %}"
        data-transmission-filter
      >
        Коробка передач
        <button
          type="button"
          class="catalog-transmission-trigger"
          aria-expanded="false"
          aria-haspopup="listbox"
        >
          <span class="catalog-transmission-trigger-label">{{ catalog_sidebar.filters.transmission_display }}</span>
        </button>
        <div class="catalog-transmission-menu" hidden>
          {% for group in catalog_sidebar.options.transmission_groups %}
            {% if group.subtypes %}
              <label class="catalog-transmission-row{% if group.slug in checked_transmissions %} is-selected{% endif %}">
                <span>{{ group.label }}</span>
                <input
                  type="checkbox"
                  value="{{ group.slug }}"
                  data-transmission-role="parent"
                  data-label="{{ group.label }}"
                  {% if group.slug in checked_transmissions %}checked{% endif %}
                />
              </label>
              {% for subtype in group.subtypes %}
                <label class="catalog-transmission-row catalog-transmission-row-sub{% if subtype.slug in checked_transmissions %} is-selected{% endif %}">
                  <span>{{ subtype.label }}</span>
                  <input
                    type="checkbox"
                    value="{{ subtype.slug }}"
                    data-transmission-role="subtype"
                    data-label="{{ subtype.label }}"
                    {% if subtype.slug in checked_transmissions %}checked{% endif %}
                  />
                </label>
              {% endfor %}
            {% else %}
              <label class="catalog-transmission-row{% if group.slug in checked_transmissions %} is-selected{% endif %}">
                <span>{{ group.label }}</span>
                <input
                  type="checkbox"
                  value="{{ group.slug }}"
                  data-transmission-role="manual"
                  data-label="{{ group.label }}"
                  {% if group.slug in checked_transmissions %}checked{% endif %}
                />
              </label>
            {% endif %}
          {% endfor %}
        </div>
        <div class="catalog-transmission-values"></div>
      </label>
      <label class="catalog-filter-field{% if catalog_sidebar.filters.year_from %} is-active{% endif %}">
        Год от
        <select name="year_from">
          <option value="" {% if catalog_sidebar.filters.year_from == "" %}selected{% endif %}>Не важно</option>
          {% for year in catalog_sidebar.options.years %}
            <option value="{{ year }}" {% if catalog_sidebar.filters.year_from == year %}selected{% endif %}>{{ year }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="catalog-filter-field{% if catalog_sidebar.filters.year_to %} is-active{% endif %}">
        Год до
        <select name="year_to">
          <option value="" {% if catalog_sidebar.filters.year_to == "" %}selected{% endif %}>Не важно</option>
          {% for year in catalog_sidebar.options.years %}
            <option value="{{ year }}" {% if catalog_sidebar.filters.year_to == year %}selected{% endif %}>{{ year }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="catalog-filter-field{% if catalog_sidebar.filters.export_country %} is-active{% endif %}">
        Страна экспорта
        <select name="export_country">
          <option value="" {% if catalog_sidebar.filters.export_country == "" %}selected{% endif %}>Любая</option>
          {% for value in catalog_sidebar.options.export_country %}
            <option value="{{ value }}" {% if catalog_sidebar.filters.export_country == value %}selected{% endif %}>{{ value }}</option>
          {% endfor %}
        </select>
      </label>
      {% if is_admin %}
      <label class="inline-checkbox catalog-filter-field{% if catalog_sidebar.filters.exact_hp %} is-active{% endif %}">
        <input type="checkbox" name="exact_hp" value="1" {% if catalog_sidebar.filters.exact_hp %}checked{% endif %} />
        Ровно 160 л.с.
      </label>
      {% endif %}
      <label class="inline-checkbox catalog-filter-field{% if catalog_sidebar.filters.with_listings %} is-active{% endif %}">
        <input type="checkbox" name="with_listings" value="1" {% if catalog_sidebar.filters.with_listings %}checked{% endif %} />
        Только с объявлениями в продаже
      </label>
    </div>

    <button type="submit" class="catalog-filters-submit">Применить</button>
    <a class="page-link" href="{{ filters_reset_url | default('/catalog') }}">Сбросить</a>
  </form>
</aside>
<script src="/static/catalog_transmission_filter.js?v=20260819-02" defer></script>
