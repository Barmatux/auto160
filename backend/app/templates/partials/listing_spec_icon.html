{% macro listing_spec_icon(name) -%}
<span class="listing-spec-icon" aria-hidden="true">
  {% if name == 'body' %}
  <img src="/static/icons/body.png" alt="" width="20" height="20" />
  {% elif name == 'engine' %}
  <img src="/static/icons/engine.png" alt="" width="20" height="20" />
  {% elif name == 'transmission' %}
  {# Manual H-gate shifter #}
  <svg viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="5.7" r="2.05" stroke="currentColor" stroke-width="1.55"/>
    <path d="M11.15 5.35c.55-.35 1.15-.35 1.7 0" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M12 7.75v2.35" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/>
    <rect x="7.1" y="10.2" width="9.8" height="8.8" rx="1.7" stroke="currentColor" stroke-width="1.55"/>
    <path d="M9.35 12.1v5.9M12 12.1v5.9M14.65 12.1v5.9M9.35 15.05h5.3" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/>
  </svg>
  {% elif name == 'drive' %}
  {# Full-time 4WD: top-down drivetrain schematic #}
  <svg viewBox="0 0 24 24" fill="none">
    <rect x="5.6" y="4.6" width="2.35" height="3.55" rx="0.65" stroke="currentColor" stroke-width="1.5"/>
    <rect x="16.05" y="4.6" width="2.35" height="3.55" rx="0.65" stroke="currentColor" stroke-width="1.5"/>
    <rect x="5.6" y="15.85" width="2.35" height="3.55" rx="0.65" stroke="currentColor" stroke-width="1.5"/>
    <rect x="16.05" y="15.85" width="2.35" height="3.55" rx="0.65" stroke="currentColor" stroke-width="1.5"/>
    <path d="M8 6.38h2.55M13.45 6.38H18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M10.55 6.38h2.9M12 6.38v2.15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M12 8.53v9.05M8 17.62h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  {% endif %}
</span>
{%- endmacro %}
