{% if customs and customs.found and customs.release_date %}
  <p class="listing-customs-info">
    <strong>Дата ввоза в РБ {{ customs.release_date }}г.</strong>
  </p>
{% elif is_admin and customs %}
  <p class="listing-customs-info">
    <strong>Дата ввоза в РБ:</strong>
    {% if customs.found %}
      <span class="hint">найдено в ГТК, дата не распознана</span>
    {% else %}
      <span class="hint">не найдено в базе ГТК</span>
    {% endif %}
  </p>
{% endif %}
