{% set vh = vehicle_hierarchy %}
<div
  class="vehicle-hierarchy-filters"
  data-vehicle-hierarchy-config="{{ vh.config | tojson }}"
  data-make-field="{{ vh.make_field }}"
  data-model-field="{{ vh.model_field }}"
  data-generation-field="{{ vh.generation_field }}"
>
  <div class="vehicle-hierarchy-head">
    <strong class="vehicle-hierarchy-title">Поиск по параметрам</strong>
    <button type="button" class="vehicle-hierarchy-add">+ {{ vh.labels.make }}</button>
  </div>

  <div class="vehicle-hierarchy-rows">
    {% for row in vh.rows %}
    <div class="vehicle-hierarchy-row">
      <label class="vehicle-hierarchy-field">
        <span class="vehicle-hierarchy-label">{{ vh.labels.make }}</span>
        <select name="{{ vh.make_field }}" data-tier="make">
          <option value="">{{ vh.labels.make }}</option>
          {% for make in vh.config.makes %}
            <option value="{{ make }}" {% if row.make == make %}selected{% endif %}>{{ make }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="vehicle-hierarchy-field">
        <span class="vehicle-hierarchy-label">{{ vh.labels.model }}</span>
        <select name="{{ vh.model_field }}" data-tier="model"{% if not row.make %} disabled{% endif %}>
          <option value="">{{ vh.labels.model }}</option>
          {% if row.make %}
            {% for model in vh.config.modelMap.get(row.make, []) %}
              <option value="{{ model }}" {% if row.model == model %}selected{% endif %}>{{ model }}</option>
            {% endfor %}
          {% endif %}
        </select>
      </label>
      <label class="vehicle-hierarchy-field">
        <span class="vehicle-hierarchy-label">{{ vh.labels.generation }}</span>
        <select name="{{ vh.generation_field }}" data-tier="generation"{% if not row.model %} disabled{% endif %}>
          <option value="">{{ vh.labels.generation }}</option>
          {% if row.make and row.model %}
            {% for generation in vh.config.generationMap.get(row.make, {}).get(row.model, []) %}
              <option value="{{ generation }}" {% if row.generation == generation %}selected{% endif %}>{{ generation }}</option>
            {% endfor %}
          {% endif %}
        </select>
      </label>
      <button type="button" class="vehicle-hierarchy-remove" aria-label="Удалить строку">×</button>
    </div>
    {% endfor %}
  </div>
</div>
