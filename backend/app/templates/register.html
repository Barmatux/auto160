{% extends "base.html" %}
{% block title %}Регистрация - Auto160{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<p class="hint">Регистрация по email. Логин генерируется автоматически и показывается после создания.</p>

<form class="form" onsubmit="event.preventDefault(); registerByApi();">
  <label>Имя <input id="name" required /></label>
  <label>Email <input id="email" type="email" required autocomplete="email" /></label>
  <label>Пароль <input id="password" type="password" required minlength="6" autocomplete="new-password" /></label>
  <label>Повторите пароль <input id="password_confirm" type="password" required minlength="6" autocomplete="new-password" /></label>
  <button type="submit">Создать аккаунт</button>
</form>

<p id="form-message" class="hint" hidden role="alert"></p>

{% include "partials/auth_script.html" %}
<script>
  async function registerByApi() {
    const messageEl = document.getElementById("form-message");
    messageEl.hidden = true;
    messageEl.textContent = "";

    const password = document.getElementById("password").value;
    const passwordConfirm = document.getElementById("password_confirm").value;
    if (password !== passwordConfirm) {
      messageEl.textContent = "Пароли не совпадают";
      messageEl.hidden = false;
      return;
    }

    const payload = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      password: password,
      password_confirm: passwordConfirm,
      role: "seller",
    };
    const response = await fetch("/api/v1/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await response.json();
    if (!response.ok) {
      let detail = data.detail || "Не удалось создать аккаунт";
      if (Array.isArray(detail)) {
        detail = detail.map((item) => item.msg || JSON.stringify(item)).join("; ");
      }
      messageEl.textContent = detail;
      messageEl.hidden = false;
      return;
    }

    const loginResp = await fetch("/api/v1/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ login: data.username, password: payload.password }),
    });
    const loginData = await loginResp.json();
    if (loginResp.ok && loginData.access_token && loginData.refresh_token) {
      setAuthCookies(loginData.access_token, loginData.refresh_token);
      window.location.href = "/";
      return;
    }
    messageEl.textContent = `Аккаунт создан. Ваш логин: ${data.username}. Войдите вручную на странице входа.`;
    messageEl.hidden = false;
  }
</script>
{% endblock %}
