{% extends "base.html" %}
{% block title %}Вход - Auto160{% endblock %}
{% block content %}
<h1>Вход в кабинет</h1>
<p class="hint">Можно войти по логину или email. После входа вы будете перенаправлены на главную.</p>

<form class="form" onsubmit="event.preventDefault(); loginByApi();">
  <label>Логин или email <input id="login" required autocomplete="username" /></label>
  <label>Пароль <input id="password" type="password" required autocomplete="current-password" /></label>
  <button type="submit">Войти</button>
</form>

<p id="form-message" class="hint" hidden role="alert"></p>

{% include "partials/auth_script.html" %}
<script>
  async function loginByApi() {
    const messageEl = document.getElementById("form-message");
    messageEl.hidden = true;
    messageEl.textContent = "";

    const payload = {
      login: document.getElementById("login").value.trim(),
      password: document.getElementById("password").value,
    };
    const response = await fetch("/api/v1/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await response.json();
    if (response.ok && data.access_token && data.refresh_token) {
      setAuthCookies(data.access_token, data.refresh_token);
      window.location.href = "/";
      return;
    }
    let detail = data.detail || "Неправильный логин и(или) пароль. ";
    if (Array.isArray(detail)) {
      detail = detail.map((item) => item.msg || JSON.stringify(item)).join("; ");
    }
    messageEl.textContent = detail;
    messageEl.hidden = false;
  }
</script>
{% endblock %}
