{% extends "base.html" %}
{% block title %}Вход - Auto160{% endblock %}
{% block content %}
<h1>Вход в кабинет</h1>
<p class="hint">После входа вы будете перенаправлены в кабинет.</p>

<form class="form" onsubmit="event.preventDefault(); loginByApi();">
  <label>Логин <input id="login" required /></label>
  <label>Пароль <input id="password" type="password" required /></label>
  <button type="submit">Войти</button>
</form>

<p id="form-message" class="hint" hidden role="alert"></p>

{% include "partials/auth_script.html" %}
<script>
  async function loginByApi() {
    const messageEl = document.getElementById("form-message");
    messageEl.hidden = true;
    messageEl.textContent = "";

    const payload = {
      login: document.getElementById("login").value,
      password: document.getElementById("password").value,
    };
    const response = await fetch("/api/v1/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await response.json();
    if (response.ok && data.access_token && data.refresh_token) {
      setAuthCookies(data.access_token, data.refresh_token);
      window.location.href = "/";
      return;
    }
    messageEl.textContent = data.detail || "Неверный логин или пароль";
    messageEl.hidden = false;
  }
</script>
{% endblock %}
