name: Deploy to VM

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy master → VM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Trust VM host key
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Run deploy-vm.sh on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" <<'REMOTE'
          set -euo pipefail
          APP_DIR="/home/auto160/auto160"
          if [ ! -d "$APP_DIR/.git" ]; then
            echo "ERROR: git repo not found at $APP_DIR" >&2
            exit 1
          fi
          sudo -u auto160 env APP_DIR="$APP_DIR" GIT_TERMINAL_PROMPT=0 \
            bash "$APP_DIR/scripts/deploy-vm.sh"
          REMOTE

      - name: Smoke test API
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -o BatchMode=yes "${VM_USER}@${VM_HOST}" <<'REMOTE'
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/health
          REMOTE
