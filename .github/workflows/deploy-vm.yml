name: Deploy to VM

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/home/auto160/auto160"
            if [ -n "${{ secrets.VM_APP_DIR }}" ] && [ -d "${{ secrets.VM_APP_DIR }}/.git" ]; then
              APP_DIR="${{ secrets.VM_APP_DIR }}"
            fi
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: git repo not found at $APP_DIR" >&2
              exit 1
            fi
            export APP_DIR
            export GIT_TERMINAL_PROMPT=0
            sudo -u auto160 env APP_DIR="$APP_DIR" GIT_TERMINAL_PROMPT=0 bash "$APP_DIR/scripts/deploy-vm.sh"
