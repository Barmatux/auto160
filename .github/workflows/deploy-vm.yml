name: Deploy to VM

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy master → VM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Trust VM host key
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Sync code to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          SYNC_DIR="/tmp/auto160-sync-$$"
          APP_DIR="/home/auto160/auto160"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" "rm -rf '${SYNC_DIR}' && mkdir -p '${SYNC_DIR}'"
          tar czf - \
            --exclude='.git' \
            --exclude='backend/.env.vm' \
            --exclude='backend/docker-compose.override.yml' \
            --exclude='logs' \
            --exclude='autoplius-parser/.browser-profile' \
            -C . . \
            | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "${VM_USER}@${VM_HOST}" "tar xzf - -C '${SYNC_DIR}'"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" <<REMOTE
          set -euo pipefail
          sudo rsync -a "${SYNC_DIR}/" "${APP_DIR}/"
          sudo chown -R auto160:auto160 "${APP_DIR}"
          rm -rf "${SYNC_DIR}"
          REMOTE

      - name: Run deploy-vm.sh on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" <<'REMOTE'
          set -euo pipefail
          APP_DIR="/home/auto160/auto160"
          if [ ! -d "$APP_DIR/backend" ]; then
            echo "ERROR: app dir not found at $APP_DIR" >&2
            exit 1
          fi
          sudo -u auto160 env APP_DIR="$APP_DIR" SKIP_GIT_PULL=1 \
            bash "$APP_DIR/scripts/deploy-vm.sh"
          REMOTE

      - name: Smoke test API
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -o BatchMode=yes "${VM_USER}@${VM_HOST}" <<'REMOTE'
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/health
          REMOTE
